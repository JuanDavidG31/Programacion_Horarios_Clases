spring.application.name=programacion_horarios

server.port=8080

# base de datos en memoria (se reinicia cada vez que se levanta la app)
spring.datasource.url=jdbc:h2:mem:horarios
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# origenes permitidos para el WebSocket
websocket.allowed-origins=http://localhost:5173,http://localhost:4200
# reglas del horario (se pueden cambiar sin tocar el codigo)
# horas en formato de 24 horas
horario.hora-inicio=7
horario.hora-fin=22
horario.sabado-fin=13
horario.almuerzo-inicio=12
horario.almuerzo-fin=13
horario.duracion-sesion=2
horario.max-sesiones-semana=4
